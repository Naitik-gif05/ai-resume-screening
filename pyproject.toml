[project]
name = "day5-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naitik Gupta", email = "naitikg729@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]



[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools]
py-modules = ["app", "main", "ui_helpers"]